<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img">
<title>Método babilónico: rectángulos de área 2 que se acercan a un cuadrado de lado raíz de 2</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.halo{stroke-width:5;stroke-linejoin:round;paint-order:stroke}
.f-fondo{fill:#ffffff} .s-fondo{stroke:#ffffff}
.f-tinta{fill:#1f2328} .s-tinta{stroke:#1f2328}
.f-suave{fill:#57606a} .s-suave{stroke:#57606a}
.f-tenue{fill:#8c959f} .s-tenue{stroke:#8c959f}
.f-turquesa{fill:#0d9488} .s-turquesa{stroke:#0d9488}
.f-turquesa-suave{fill:#ccfbf1} .s-turquesa-suave{stroke:#ccfbf1}
.f-violeta{fill:#7c3aed} .s-violeta{stroke:#7c3aed}
.f-ambar{fill:#d97706} .s-ambar{stroke:#d97706}
.halo{stroke:#ffffff}
@media (prefers-color-scheme: dark) {
.f-fondo{fill:#0b1120} .s-fondo{stroke:#0b1120}
.f-tinta{fill:#e6edf3} .s-tinta{stroke:#e6edf3}
.f-suave{fill:#9aa7b8} .s-suave{stroke:#9aa7b8}
.f-tenue{fill:#64748b} .s-tenue{stroke:#64748b}
.f-turquesa{fill:#2dd4bf} .s-turquesa{stroke:#2dd4bf}
.f-turquesa-suave{fill:#0f3a3a} .s-turquesa-suave{stroke:#0f3a3a}
.f-violeta{fill:#a78bfa} .s-violeta{stroke:#a78bfa}
.f-ambar{fill:#fbbf24} .s-ambar{stroke:#fbbf24}
.halo{stroke:#0b1120}
}
</style>
<rect width="680" height="410" class="f-fondo"/>
<line x1="50" y1="380" x2="310" y2="380" class="s-tenue" stroke-width="1.5" stroke-linecap="round"></line>
<rect x="60" y="167.87" width="212.13" height="212.13" fill="none" class="s-ambar" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="60" y="167.87" width="212.13" height="212.13" class="f-turquesa-suave s-turquesa" stroke-width="3"><animate attributeName="width" values="150;150;225;225;212.5;212.5;212.13;212.13" keyTimes="0.0000;0.1636;0.2727;0.4364;0.5455;0.7091;0.8182;1.0000" dur="11s" repeatCount="indefinite"/><animate attributeName="height" values="300;300;200;200;211.76;211.76;212.13;212.13" keyTimes="0.0000;0.1636;0.2727;0.4364;0.5455;0.7091;0.8182;1.0000" dur="11s" repeatCount="indefinite"/><animate attributeName="y" values="80;80;180;180;168.24;168.24;167.87;167.87" keyTimes="0.0000;0.1636;0.2727;0.4364;0.5455;0.7091;0.8182;1.0000" dur="11s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="330" y="130" class="sans f-tinta" font-size="19" font-weight="bold" text-anchor="start">n = 0 · 1 × 2</text><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.2182;1.0000" dur="11s" repeatCount="indefinite" calcMode="discrete"/></g>
<g opacity="0"><text x="330" y="130" class="sans f-tinta" font-size="19" font-weight="bold" text-anchor="start">n = 1 · 1,5 × 1,3333</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.2182;0.4909;1.0000" dur="11s" repeatCount="indefinite" calcMode="discrete"/></g>
<g opacity="0"><text x="330" y="130" class="sans f-tinta" font-size="19" font-weight="bold" text-anchor="start">n = 2 · 1,41667 × 1,41176</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.4909;0.7636;1.0000" dur="11s" repeatCount="indefinite" calcMode="discrete"/></g>
<g opacity="1"><text x="330" y="130" class="sans f-tinta" font-size="19" font-weight="bold" text-anchor="start">n = 3 · 1,414216 × 1,414211</text><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.7636;1.0000" dur="11s" repeatCount="indefinite" calcMode="discrete"/></g>
<text x="330" y="190" class="sans f-turquesa" font-size="18" font-weight="bold" text-anchor="start">área = 2 en cada paso</text>
<text x="330" y="224" class="sans f-suave" font-size="17" font-weight="normal" text-anchor="start">lado nuevo = (x + 2/x) / 2</text>
<line x1="330" y1="335" x2="366" y2="335" class="s-ambar" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"></line>
<text x="376" y="341" class="sans f-ambar" font-size="16" font-weight="normal" text-anchor="start">cuadrado de lado √2 ≈ 1,41421</text>
</svg>
