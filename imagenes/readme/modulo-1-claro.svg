</defs>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#fondo)" stroke="#d0d7de"/>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#puntos)"/>
<text x="48" y="64" class="mono" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start" letter-spacing="3">MÓDULO 1</text>
<text x="46" y="110" class="sans" font-size="36" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-0.5">Introducción</text>
<text x="48" y="148" class="sans" font-size="18" font-weight="400" fill="#57606a" text-anchor="start" >Nodos, aristas y estado: del grafo</text>
<text x="48" y="174" class="sans" font-size="18" font-weight="400" fill="#57606a" text-anchor="start" >más simple a un agente con</text>
<text x="48" y="200" class="sans" font-size="18" font-weight="400" fill="#57606a" text-anchor="start" >herramientas y memoria.</text>
