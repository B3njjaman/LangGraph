<rect x="665" y="77" width="150" height="56" rx="12" fill="#2dd4bf" opacity="0" filter="url(#difuso)"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0800;0.1100;0.6000;0.6300;1.0000" values="0;0;0.55;0.55;0;0"/></rect><rect x="665" y="77" width="150" height="56" rx="12" fill="#111a2c" stroke="#34445f" stroke-width="1.5"/><rect x="665" y="77" width="150" height="56" rx="12" fill="#2dd4bf" fill-opacity=".1" stroke="#2dd4bf" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0800;0.1100;0.6000;0.6300;1.0000" values="0;0;1;1;0;0"/></rect><text x="740" y="97" class="mono" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" dy=".35em">paso</text><text x="740" y="118" class="mono" font-size="12" font-weight="400" fill="#9aa7b8" text-anchor="middle" dy=".35em">x − f(x)/f′(x)</text>
<rect x="1050" y="85" width="100" height="40" rx="20" fill="#2dd4bf" opacity="0" filter="url(#difuso)"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6900;0.7200;0.9200;0.9500;1.0000" values="0;0;0.55;0.55;0;0"/></rect><rect x="1050" y="85" width="100" height="40" rx="20" fill="#0e1626" stroke="#34445f" stroke-width="1.5"/><rect x="1050" y="85" width="100" height="40" rx="20" fill="#2dd4bf" fill-opacity=".1" stroke="#2dd4bf" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6900;0.7200;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/></rect><text x="1100" y="105" class="mono" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" dy=".35em">END</text>
