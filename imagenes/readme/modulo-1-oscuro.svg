<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="titulo">
<title id="titulo">Módulo 1: el método de Newton como grafo; el nodo paso se repite hasta que |f(x)| &lt; ε</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.marcha{stroke-dasharray:6 7;animation:marcha 1.3s linear infinite}
@keyframes marcha{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.marcha{animation:none}}
</style>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#141d33"/></linearGradient>
<pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1b2640"/></pattern>
<filter id="difuso" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#46587a"/></marker>

</defs>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#fondo)" stroke="#26324a"/>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#puntos)"/>
<text x="48" y="64" class="mono" font-size="15" font-weight="700" fill="#2dd4bf" text-anchor="start" letter-spacing="3">MÓDULO 1</text>
<text x="46" y="110" class="sans" font-size="36" font-weight="800" fill="#e6edf3" text-anchor="start" letter-spacing="-0.5">Introducción</text>
<text x="48" y="148" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >Del método de Newton como grafo</text>
<text x="48" y="174" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >a un agente de cálculo simbólico</text>
<text x="48" y="200" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >con SymPy y memoria.</text>
<g><rect x="48" y="222" width="166.88" height="32" rx="10" fill="#2dd4bf" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".75" stroke-width="1.2"/><text x="131.44" y="238" class="mono" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">1 de 5 lecciones</text></g>
<path d="M610,105 L663,105" fill="none" stroke="#46587a" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)"/>
<path d="M815,105 L1048,105" fill="none" stroke="#46587a" stroke-width="2" stroke-linecap="round" class="marcha" marker-end="url(#flecha)"/>
<path d="M775,133 C805,205 675,205 708,136" fill="none" stroke="#46587a" stroke-width="2" stroke-linecap="round" class="marcha" marker-end="url(#flecha)"/>
<text x="930" y="89" class="mono" font-size="13" font-weight="400" fill="#9aa7b8" text-anchor="middle" >|f(x)| &lt; ε</text>
<text x="806" y="182" class="mono" font-size="13" font-weight="400" fill="#9aa7b8" text-anchor="start" >|f(x)| ≥ ε</text>
