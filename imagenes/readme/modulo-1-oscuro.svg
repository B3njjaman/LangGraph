<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2650;0.2950;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/><rect x="696.84" y="232" width="126.78" height="30" rx="10" fill="#2dd4bf" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".75" stroke-width="1.2"/><text x="760.23" y="247" class="mono" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">x₂ = 1.416667</text></g>
<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.4100;0.4400;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/><rect x="833.62" y="232" width="126.78" height="30" rx="10" fill="#2dd4bf" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".75" stroke-width="1.2"/><text x="897.01" y="247" class="mono" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">x₃ = 1.414216</text></g>
