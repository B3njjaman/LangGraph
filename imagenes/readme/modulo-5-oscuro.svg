<rect x="968" y="69.6" width="164" height="160.8" rx="16.4" fill="#a78bfa" opacity="0" filter="url(#difuso)"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2000;0.2300;0.3000;0.3300;0.4200;0.4500;0.5000;0.5300;1.0000" values="0;0;0.55;0.55;0;0;0.55;0.55;0;0"/></rect><path d="M968,86 L968,214 A82,16.4 0 0 0 1132,214 L1132,86" fill="#111a2c" stroke="#a78bfa" stroke-width="1.8"/><ellipse cx="1050" cy="86" rx="82" ry="16.4" fill="#0e1626" stroke="#a78bfa" stroke-width="1.8"/>
