</defs>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#fondo)" stroke="#26324a"/>
<rect x=".5" y=".5" width="1199" height="289" rx="18" fill="url(#puntos)"/>
<text x="48" y="64" class="mono" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="3">MÓDULO 5</text>
<text x="46" y="110" class="sans" font-size="36" font-weight="800" fill="#e6edf3" text-anchor="start" letter-spacing="-0.5">Memoria a largo plazo</text>
<text x="48" y="148" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >Memoria que sobrevive entre</text>
<text x="48" y="174" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >hilos con el Store: perfiles</text>
<text x="48" y="200" class="sans" font-size="18" font-weight="400" fill="#9aa7b8" text-anchor="start" >y colecciones.</text>
<g><rect x="48" y="222" width="132.16" height="32" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.2"/><text x="114.08" y="238" class="mono" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">por escribir</text></g>
<text x="500" y="50" class="mono" font-size="12" font-weight="400" fill="#9aa7b8" text-anchor="start" >hilo 1 · thread_id="1"</text>
<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0400;0.0700;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/><rect x="500" y="62" width="240" height="36" rx="10" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".75" stroke-width="1.2"/><text x="620" y="80" class="sans" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">Respóndeme siempre en LaTeX</text></g>
<text x="500" y="150" class="mono" font-size="12" font-weight="400" fill="#9aa7b8" text-anchor="start" >hilo 2 · thread_id="2"</text>
<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.3600;0.3900;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/><rect x="500" y="162" width="246" height="36" rx="10" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".75" stroke-width="1.2"/><text x="623" y="180" class="sans" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">¿Cuál es la derivada de x³?</text></g>
<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5400;0.5700;0.9200;0.9500;1.0000" values="0;0;1;1;0;0"/><rect x="540" y="208" width="246" height="36" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.2"/><text x="663" y="226" class="sans" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle" dy=".35em">La derivada es $3x^{2}$</text></g>
