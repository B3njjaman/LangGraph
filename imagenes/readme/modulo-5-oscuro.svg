<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="titulo">
<title id="titulo">Módulo 5: una preferencia guardada en el Store desde una conversación se usa en otra</title>
<style>
